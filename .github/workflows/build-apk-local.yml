# ============================================================================
# Build APK locally on GitHub Actions runner (NO EAS Build quota needed!)
# ============================================================================
# Builds production APK (NOT development build) with debug signing.
# Uses pre-installed Android SDK on ubuntu-latest runner.
# ============================================================================
name: Build APK (Local)

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to build"
        required: true
        type: choice
        default: mobile-wali
        options:
          - mobile-wali
          - mobile-bendahara
          - mobile-guru
          - mobile-kepala
          - all

jobs:
  build:
    name: Build APK — ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ github.event.inputs.app == 'all' && fromJson('["mobile-wali","mobile-bendahara","mobile-guru","mobile-kepala"]') || fromJson(format('["{0}"]', github.event.inputs.app)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>&1 || true
          echo "✓ Android SDK ready"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Install app dependencies
        working-directory: apps/${{ matrix.app }}
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Expo CLI
        run: |
          npm install -g expo-cli@latest
          npx expo --version

      - name: Generate native Android project
        working-directory: apps/${{ matrix.app }}
        run: |
          npx expo prebuild --platform android --no-install --clean

      - name: Sign release APK with debug keystore (so it's installable)
        working-directory: apps/${{ matrix.app }}/android
        run: |
          # Patch build.gradle to use debug signing for release build
          # This makes the APK installable on any device without needing
          # a production keystore.
          cat >> app/build.gradle << 'GRADLE_PATCH'

          // === DEBUG SIGNING FOR RELEASE BUILD ===
          // Makes release APK installable without production keystore
          android {
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          GRADLE_PATCH
          echo "✓ Patched build.gradle: release uses debug signing"

      - name: Build Release APK (production, no dev launcher)
        working-directory: apps/${{ matrix.app }}/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -x lint --no-daemon --stacktrace

      - name: Find APK
        id: find-apk
        working-directory: apps/${{ matrix.app }}
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ No APK found!"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "✅ Found APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30
          compression-level: 0

      - name: Summary
        run: |
          echo "## 📱 Production APK Built — ${{ matrix.app }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the Artifacts section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **App**: \`${{ matrix.app }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Build**: Release APK (signed with debug key — installable on Android 5+)" >> $GITHUB_STEP_SUMMARY
          echo "- **No dev launcher**: App langsung jalan production mode (tidak ada layar 'Development servers')" >> $GITHUB_STEP_SUMMARY
          echo "- **Install**: Settings → Security → Unknown Sources → Install APK" >> $GITHUB_STEP_SUMMARY
